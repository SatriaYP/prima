name: Prima.id CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    # API v2 Testing
    - name: Install API v2 dependencies
      working-directory: ./api-v2
      run: npm ci
      
    - name: Run Prisma generate
      working-directory: ./api-v2
      run: npx prisma generate
      
    - name: Run API v2 tests
      working-directory: ./api-v2
      run: |
        if npm run | grep -q "test"; then
          npm test
        else
          echo "No test script found, skipping tests"
        fi
      env:
        NODE_ENV: test
        DATABASE_URL: "file:./test.db"
        
    - name: Run API v2 linting
      working-directory: ./api-v2
      run: |
        if npm run | grep -q "lint"; then
          npm run lint
        else
          echo "No lint script found, skipping linting"
        fi
      
    # Web Testing
    - name: Install Web dependencies
      working-directory: ./web
      run: yarn install --frozen-lockfile
      
    - name: Run Web linting
      working-directory: ./web
      run: |
        if yarn run | grep -q "lint"; then
          yarn lint
        else
          echo "No lint script found, skipping linting"
        fi
      
    - name: Run Web tests
      working-directory: ./web
      run: |
        if yarn run | grep -q "test:unit"; then
          yarn test:unit
        else
          echo "No test:unit script found, skipping tests"
        fi
      
    - name: Build Web application
      working-directory: ./web
      run: yarn build
      
    # Security Audit
    - name: API v2 Security Audit
      working-directory: ./api-v2
      run: npm audit --audit-level=moderate || echo "Security audit completed"
        
    - name: Web Security Audit
      working-directory: ./web
      run: yarn audit --level moderate || echo "Security audit completed"
        
  deploy-staging:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 212.85.26.97 >> ~/.ssh/known_hosts
        
    - name: Deploy to Staging Server
      run: |
        echo "Deploying to staging server 212.85.26.97"
        
        # Create staging directories if not exist
        ssh ${{ secrets.SSH_USER }}@212.85.26.97 "
          sudo mkdir -p /var/www/prima-web-staging/{api,web}
          sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /var/www/prima-web-staging
        "
        
        # Deploy API v2
        rsync -avz --delete ./api-v2/ ${{ secrets.SSH_USER }}@212.85.26.97:/var/www/prima-web-staging/api/
        
        # Deploy Web
        cd web
        yarn install --frozen-lockfile
        yarn build
        rsync -avz --delete dist/ ${{ secrets.SSH_USER }}@212.85.26.97:/var/www/prima-web-staging/web/
        
        # Restart services
        ssh ${{ secrets.SSH_USER }}@212.85.26.97 "
          cd /var/www/prima-web-staging/api
          npm install --production
          
          # Verify file exists before starting PM2
          if [ -f src/app.js ]; then
            pm2 restart prima-web-api-staging || pm2 start src/app.js --name prima-web-api-staging
          else
            echo 'ERROR: src/app.js not found!'
            ls -la src/
            exit 1
          fi
          
          # Reload nginx for web
          sudo systemctl reload nginx
        "
        
  deploy-production:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 212.85.26.97 >> ~/.ssh/known_hosts
        
    - name: Deploy to Production Server
      run: |
        echo "Deploying to production server 212.85.26.97"
        
        # Create production directories if not exist
        ssh ${{ secrets.SSH_USER }}@212.85.26.97 "
          sudo mkdir -p /var/www/prima-web/{api,web}
          sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /var/www/prima-web
        "
        
        # Deploy API v2
        rsync -avz --delete ./api-v2/ ${{ secrets.SSH_USER }}@212.85.26.97:/var/www/prima-web/api/
        
        # Deploy Web
        cd web
        yarn install --frozen-lockfile
        yarn build
        rsync -avz --delete dist/ ${{ secrets.SSH_USER }}@212.85.26.97:/var/www/prima-web/web/
        
        # Restart services
        ssh ${{ secrets.SSH_USER }}@212.85.26.97 "
          cd /var/www/prima-web/api
          npm install --production
          
          # Verify file exists before starting PM2
          if [ -f src/app.js ]; then
            pm2 restart prima-web-api || pm2 start src/app.js --name prima-web-api
          else
            echo 'ERROR: src/app.js not found!'
            ls -la src/
            exit 1
          fi
          
          # Reload nginx for web
          sudo systemctl reload nginx
        " 