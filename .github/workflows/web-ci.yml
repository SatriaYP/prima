name: Web CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'web/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        cache-dependency-path: web/yarn.lock
        
    - name: Install dependencies
      working-directory: ./web
      run: yarn install --frozen-lockfile
      
    - name: Run linting
      working-directory: ./web
      run: yarn lint || echo "Linting not configured"
      
    - name: Run tests
      working-directory: ./web
      run: yarn test:unit || echo "Unit tests not configured"
      
    - name: Build application
      working-directory: ./web
      run: yarn build
      
  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        cache-dependency-path: web/yarn.lock
        
    - name: Install dependencies
      working-directory: ./web
      run: yarn install --frozen-lockfile
      
    - name: Run security audit
      working-directory: ./web
      run: yarn audit --level moderate || echo "Security audit completed"
      
  e2e-tests:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        cache-dependency-path: web/yarn.lock
        
    - name: Install dependencies
      working-directory: ./web
      run: yarn install --frozen-lockfile
      
    - name: Run E2E tests
      working-directory: ./web
      run: yarn test:e2e || echo "E2E tests not configured"
      
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        cache-dependency-path: web/yarn.lock
        
    - name: Install dependencies
      working-directory: ./web
      run: yarn install --frozen-lockfile
      
    - name: Build for staging
      working-directory: ./web
      run: yarn build
      env:
        NODE_ENV: staging
        VUE_APP_API_URL: ${{ secrets.STAGING_API_URL }}
        
    - name: Deploy to staging
      run: |
        echo "Deploying Web to staging environment"
        # Add your deployment commands here
        # Example: rsync, docker build, or cloud deployment
        
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test, security, e2e-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'
        cache-dependency-path: web/yarn.lock
        
    - name: Install dependencies
      working-directory: ./web
      run: yarn install --frozen-lockfile
      
    - name: Build for production
      working-directory: ./web
      run: yarn build
      env:
        NODE_ENV: production
        VUE_APP_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        
    - name: Deploy to production
      run: |
        echo "Deploying Web to production environment"
        # Add your deployment commands here
        # Example: rsync, docker build, or cloud deployment 