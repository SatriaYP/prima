name: API v2 CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api-v2/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api-v2/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: api-v2/package-lock.json
        
    - name: Install dependencies
      working-directory: ./api-v2
      run: npm ci
      
    - name: Run Prisma generate
      working-directory: ./api-v2
      run: npx prisma generate
      
    - name: Run tests
      working-directory: ./api-v2
      run: npm test
      env:
        NODE_ENV: test
        DATABASE_URL: "file:./test.db"
        
    - name: Run linting
      working-directory: ./api-v2
      run: npm run lint || echo "Linting not configured"
      
  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: api-v2/package-lock.json
        
    - name: Install dependencies
      working-directory: ./api-v2
      run: npm ci
      
    - name: Run security audit
      working-directory: ./api-v2
      run: npm audit --audit-level=moderate
      
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: api-v2/package-lock.json
        
    - name: Install dependencies
      working-directory: ./api-v2
      run: npm ci --only=production
      
    - name: Run Prisma generate
      working-directory: ./api-v2
      run: npx prisma generate
      
    - name: Deploy to staging
      run: |
        echo "Deploying API v2 to staging environment"
        # Add your deployment commands here
        # Example: rsync, docker build, or cloud deployment
        
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: api-v2/package-lock.json
        
    - name: Install dependencies
      working-directory: ./api-v2
      run: npm ci --only=production
      
    - name: Run Prisma generate
      working-directory: ./api-v2
      run: npx prisma generate
      
    - name: Deploy to production
      run: |
        echo "Deploying API v2 to production environment"
        # Add your deployment commands here
        # Example: rsync, docker build, or cloud deployment 